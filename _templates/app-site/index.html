<header class="header app-header">
  <img src="../images/app-icon.png" width="80" height="80" alt="$icon_alt" class="logo">
  <div><h1><bdi>$app_name</bdi></h1><p class="meta">$platform</p></div>
</header>
<main id="main">
  <section class="card description" aria-labelledby="intro-heading">
    <h2 id="intro-heading">$headline</h2>
    $intro
    <ul class="feature-list">$features</ul>
  </section>
  <section class="card pricing" aria-labelledby="pricing-heading">
    <h2 id="pricing-heading">$pricing_heading</h2>
    <p class="price">$price</p>
    <p>$pricing_text</p>
  </section>
  <section class="card support-section" aria-labelledby="support-heading">
    <h2 id="support-heading">$support_heading</h2>
    <h3>$faq_heading</h3>
    $faqs
    <div class="contact-support">
      <h3>$contact_heading</h3><p>$contact_text</p>
      <a class="contact-button" href="mailto:$email?subject=$email_subject">$contact_action</a>
      <p class="meta contact-address">$email</p>
    </div>
  </section>
</main>
